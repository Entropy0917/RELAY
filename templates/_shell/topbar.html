{#- Top bar: breadcrumbs (block `crumbs`) and the persona switcher. -#}
<header class="topbar">
  <div class="topbar__crumbs">
    <span>{{ shell.engagement.name }}</span>
    <span aria-hidden="true">/</span>
    <strong>{% block crumbs %}{% for item in shell.nav if item.key == shell.active %}{{ item.label }}{% endfor %}{% endblock %}</strong>
  </div>
  <div class="topbar__spacer"></div>
  <form class="persona-switch" hx-post="{{ shell.persona_switch_href }}" role="group" aria-label="Viewing as">
    <span class="persona-switch__label t-caps">Viewing as</span>
    {% for p in shell.personas %}
    <button type="submit" name="persona_id" value="{{ p.id }}"
            aria-pressed="{{ 'true' if p.id == shell.current_persona.id else 'false' }}"
            title="{{ p.person.name }} · {{ p.person.title }}">
      <span class="avatar{{ ' avatar--expert' if p.role == 'expert' }}" aria-hidden="true">{{ p.person.initials }}</span>
      <span>{{ p.person.name.split(' ')[-1] }}</span>
      <span class="persona-switch__role">{{ p.role.replace('_', ' ')|title }}</span>
    </button>
    {% endfor %}
  </form>
</header>
