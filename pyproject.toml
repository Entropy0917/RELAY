[project]
name = "relay"
version = "0.1.0"
description = "RELAY — knowledge-transfer and workforce-localization platform"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
