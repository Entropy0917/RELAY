[project]
name = "relay"
version = "0.2.0"
description = "RELAY — knowledge transfer and workforce localization"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "pydantic>=2.11",
    "openai>=1.99",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "contracts"]
